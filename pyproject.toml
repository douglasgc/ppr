[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppr-client"
version = "0.1.0"
description = "Pipeline do Banco Mundial e simulador parametrizável de PPR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4", "requests>=2.32,<3", "streamlit>=1.49,<2",
    "altair>=5,<7", "babel>=2.16,<3", "pycountry>=24.6",
    "plotly>=6,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=1.20,<2",
]

[project.scripts]
ppr = "ppr.cli:main"
ppr-serve = "ppr.server:main"

[tool.setuptools.packages.find]
include = ["ppr*"]
